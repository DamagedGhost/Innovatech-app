name: CI/CD INNOVATECH - Producción

on:
  push:
    branches: [ "deploy" ]

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout del código
      uses: actions/checkout@v3

    - name: 2. Configurar credenciales AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: 3. Login en Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: 4. Build & Push - Frontend
      env:
        REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        cd front_despacho
        docker build -t $REGISTRY/innovatech-frontend:${{ env.IMAGE_TAG }} -t $REGISTRY/innovatech-frontend:latest .
        docker push -a $REGISTRY/innovatech-frontend

    - name: 5. Build & Push - Backend Ventas
      env:
        REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        cd back-Ventas_SpringBoot/Springboot-API-REST
        docker build -t $REGISTRY/innovatech-ventas:${{ env.IMAGE_TAG }} -t $REGISTRY/innovatech-ventas:latest .
        docker push -a $REGISTRY/innovatech-ventas

    - name: 6. Build & Push - Backend Despachos
      env:
        REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        cd back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
        docker build -t $REGISTRY/innovatech-despachos:${{ env.IMAGE_TAG }} -t $REGISTRY/innovatech-despachos:latest .
        docker push -a $REGISTRY/innovatech-despachos

    - name: 7. Desplegar Capa de Datos y Lógica (EC2_BACK_ID)
      run: |
        REGISTRY_URL="${{ steps.login-ecr.outputs.registry }}"
        
        cat << 'SCRIPT_EOF' > deploy_back.sh
        set -e
        mkdir -p /home/ec2-user/innovatech-prod && cd /home/ec2-user/innovatech-prod

        # Autenticación y descarga de imágenes
        aws ecr get-login-password --region __REGION__ | docker login --username AWS --password-stdin __REGISTRY__
        docker pull __REGISTRY__/innovatech-ventas:__TAG__
        docker pull __REGISTRY__/innovatech-despachos:__TAG__

        # Preparación del entorno
        docker network create innovatech-net || true
        docker volume create db_data || true

        # Limpieza estricta (Elimina cualquier contenedor previo)
        docker rm -f backend-ventas back-ventas backend-despachos back-despachos db-mysql innovatech-db frontend-app || true

        # 1. Despliegue de Base de Datos
        docker run -d --name db-mysql --restart unless-stopped --network innovatech-net \
          -v db_data:/var/lib/mysql -e MYSQL_DATABASE=innovatech_db \
          -e MYSQL_ROOT_PASSWORD=__ROOT_PWD__ -e MYSQL_USER=__APP_USER__ -e MYSQL_PASSWORD=__APP_PWD__ \
          -p 3306:3306 mysql:8.0

        # 2. Despliegue de Microservicios
        docker run -d --name backend-ventas --restart unless-stopped --network innovatech-net \
          -p 8081:8080 -e DB_ENDPOINT=db-mysql -e DB_PORT=3306 -e DB_NAME=innovatech_db \
          -e DB_USERNAME=__APP_USER__ -e DB_PASSWORD=__APP_PWD__ \
          __REGISTRY__/innovatech-ventas:__TAG__

        docker run -d --name backend-despachos --restart unless-stopped --network innovatech-net \
          -p 8082:8080 -e DB_ENDPOINT=db-mysql -e DB_PORT=3306 -e DB_NAME=innovatech_db \
          -e DB_USERNAME=__APP_USER__ -e DB_PASSWORD=__APP_PWD__ \
          __REGISTRY__/innovatech-despachos:__TAG__

        # Mantenimiento del nodo
        docker image prune -a -f
        SCRIPT_EOF

        # Inyección de variables seguras
        sed -i "s|__REGISTRY__|$REGISTRY_URL|g; s|__TAG__|${{ env.IMAGE_TAG }}|g; s|__REGION__|${{ secrets.AWS_REGION }}|g; s|__ROOT_PWD__|${{ secrets.MYSQL_ROOT_PASSWORD }}|g; s|__APP_USER__|${{ secrets.MYSQL_APP_USER }}|g; s|__APP_PWD__|${{ secrets.MYSQL_APP_PASSWORD }}|g" deploy_back.sh
        
        COMMAND_ID=$(aws ssm send-command --instance-ids "${{ secrets.EC2_BACK_ID }}" --document-name "AWS-RunShellScript" --parameters "{\"commands\":[\"echo $(base64 -w 0 deploy_back.sh) | base64 -d | bash\"]}" --query "Command.CommandId" --output text)
        
        if ! aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_BACK_ID }}"; then
          echo "❌ Error en el despliegue del Backend. Detalles:"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_BACK_ID }}" --query "StandardErrorContent" --output text
          exit 1
        fi

    - name: 8. Desplegar Capa de Presentación (EC2_FRONT_ID)
      run: |
        REGISTRY_URL="${{ steps.login-ecr.outputs.registry }}"
        
        cat << 'SCRIPT_EOF' > deploy_front.sh
        set -e
        mkdir -p /home/ec2-user/innovatech-prod && cd /home/ec2-user/innovatech-prod

        aws ecr get-login-password --region __REGION__ | docker login --username AWS --password-stdin __REGISTRY__
        docker pull __REGISTRY__/innovatech-frontend:__TAG__

        docker rm -f frontend-app backend-ventas back-ventas backend-despachos back-despachos db-mysql innovatech-db || true

        docker run -d --name frontend-app --restart unless-stopped -p 80:80 \
          __REGISTRY__/innovatech-frontend:__TAG__

        docker image prune -a -f
        SCRIPT_EOF

        sed -i "s|__REGISTRY__|$REGISTRY_URL|g; s|__TAG__|${{ env.IMAGE_TAG }}|g; s|__REGION__|${{ secrets.AWS_REGION }}|g" deploy_front.sh
        
        COMMAND_ID=$(aws ssm send-command --instance-ids "${{ secrets.EC2_FRONT_ID }}" --document-name "AWS-RunShellScript" --parameters "{\"commands\":[\"echo $(base64 -w 0 deploy_front.sh) | base64 -d | bash\"]}" --query "Command.CommandId" --output text)
        
        if ! aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_FRONT_ID }}"; then
          echo "❌ Error en el despliegue del Frontend. Detalles:"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_FRONT_ID }}" --query "StandardErrorContent" --output text
          exit 1
        fi